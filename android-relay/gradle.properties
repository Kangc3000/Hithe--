# JVM args for Gradle. 4G is generous; reduce if your dev machine is tight.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use AndroidX (the modern support libraries).
android.useAndroidX=true

# Kotlin code style (official Kotlin convention, not Android-legacy).
kotlin.code.style=official

# Don't share the project's R class across modules (avoids accidental
# coupling and helps build times).
android.nonTransitiveRClass=true

# Parallel + cached builds.
org.gradle.parallel=true
org.gradle.caching=true

# The repo folder name (Hithe-解語) contains non-ASCII characters. AGP
# blocks Windows builds on non-ASCII paths by default because some native
# build tools (NDK/aapt) can choke. This app has no native code, so it's
# safe to override. ASCII-path checkouts are unaffected by this line.
android.overridePathCheck=true

# IMPORTANT: gpr.user / gpr.key for the Meta SDK GitHub Packages repo
# do NOT belong in this file. Put them in ~/.gradle/gradle.properties so
# they're never committed. See INSTALLATION-ANDROID.md Step 6.
